<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>CrossGuard | Motorola Solutions</title>
  <meta name="theme-color" content="#020e1c" />

  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #051028;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
    }

    .stage {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(32px, 6vh, 80px);
      text-align: center;
      padding: clamp(32px, 6vh, 90px);
    }

    h1 {
      font-size: clamp(48px, 11vh, 150px);
      line-height: 0.95;
      font-weight: 900;
      letter-spacing: -0.01em;
      text-transform: uppercase;
    }

    .qr-wrap {
      padding: clamp(14px, 2vh, 26px);
      border: 4px solid #00A3E0;
      border-radius: 24px;
    }
    #qr {
      display: block;
      width: clamp(240px, 38vh, 460px);
      height: clamp(240px, 38vh, 460px);
      image-rendering: pixelated;
    }

    .url {
      font-size: clamp(40px, 9vh, 130px);
      font-weight: 900;
      letter-spacing: 0.01em;
      color: #00A3E0;
    }
  </style>
</head>

<body>
  <div class="stage">
    <h1>ZAGRAJ W NASZĄ GRĘ</h1>
    <div class="qr-wrap">
      <canvas id="qr"></canvas>
    </div>
    <div class="url">CROSSGUARD.PL</div>
  </div>

  <script>
    const TARGET_URL = 'https://crossguard.pl';

    function drawQR() {
      const canvas = document.getElementById('qr');
      const ctx = canvas.getContext('2d');

      const qr = qrcode(0, 'M');
      qr.addData(TARGET_URL);
      qr.make();

      const count = qr.getModuleCount();
      const scale = 16;
      const size = count * scale;
      canvas.width = size;
      canvas.height = size;

      // Tło dopasowane do strony, moduły w kolorze Motoroli
      ctx.fillStyle = '#051028';
      ctx.fillRect(0, 0, size, size);
      ctx.fillStyle = '#00A3E0';
      for (let row = 0; row < count; row++) {
        for (let col = 0; col < count; col++) {
          if (qr.isDark(row, col)) {
            ctx.fillRect(col * scale, row * scale, scale, scale);
          }
        }
      }
    }

    if (window.qrcode) drawQR();
    else window.addEventListener('load', drawQR);
  </script>
</body>

</html>
